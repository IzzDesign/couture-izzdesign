<!DOCTYPE html>
<html>
  <html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Izzdesign – couture d'accessoires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pattaya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/design.css">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <header>
      <a href="/"><img src="logo_couture-izzdesign.svg" width="200" height="200" alt="Logo izzdesign couture d'accessoires"></a>
      <nav>
        <a href="/a-propos.html">À propos</a>
        <a href="/index.html">Réalisations</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>
    <section>
        <div class="column contact">
  <h2>Contactez-moi</h2>
  <form class="contact" action="https://neamar.fr/email.php" accept-charset="utf-8" onsubmit="document.getElementById('protection').value = 2" method="POST" id="contactform">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Email" name="_replyto" autofocus required>
        <input type="hidden" name="_to" value="contact@izzdesign.fr" />
        <input type="hidden" name="_subject" value="Contact via site couture-izzdesign" />
        <input type="hidden" name="protection" id="protection" value="1" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea class="form-control" id="message" rows="17" name="message"></textarea>
      </div>
      <div class="info">
        <div class="success">
            Votre message a bien été envoyé !
          </div>
          <div class="error">
            Une erreur s'est produite à l'envoi de votre mail !
          </div>
      </div>
      <input class="button btn-rouge" type="submit" value="Envoyer"/>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script>
  $(document).ready(function() {
    $("#contactform").submit(function (e) {

      e.preventDefault(); // avoid to execute the actual submit of the form.
      $("#contactform .success").hide();
      $("#contactform .error").hide();

      var form = $(this);
      var url = form.attr('action');

      $.ajax({
        type: "POST",
        url: url,
        crossDomain: true,
        data: form.serialize(), // serializes the form's elements.
        success: function (data) {
          console.log('Form success', data);
          $("#contactform .success").show(200);
        },
        error: function (xhr, status, c) {
          console.log(xhr.responseText);
          console.log('Form error', xhr, '####', status, '####', c);
          $("#contactform .error").show(200);
        }
      });
    });
  });
</script>
    </section>
  </body>
</html>
